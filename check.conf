# mgit check: the rules a push must pass before anything leaves this machine. `mgit push` runs them on what it would
# send; `mgit check [REV]` runs them alone. Read again on every run: your own file, $XDG_CONFIG_HOME/mgit/check.conf
# (.config/mgit/check.conf in your home directory when XDG_CONFIG_HOME is unset), when it exists, else this file as
# installed (/usr/local/share/mgit/check.conf for a default build). Your own file replaces this one rather than adding
# to it: copy this file there and add your rules to the copy.
#
# One rule a line, KIND VALUE; blank lines and lines starting with # are skipped, trailing blanks dropped.
# A PATTERN is a POSIX extended regular expression (glibc's, so \b works); a leading (?i) ignores case.
#   secret PATTERN    a key, token or password: FAIL
#   private PATTERN   text that must not leave this machine: FAIL
#   allow PATTERN     not a hit: a secret or private match whose "WHERE: MATCH" (e.g. "src/a.c:12: a@example.com"
#                     or "third_party/x.h:40: hostA") this matches; for the fixed rules, the printed line
#   branch PATTERN    the branch names a push may update; any other: FAIL
#   tag PATTERN       the tag names a push may create; any other: FAIL
#   warn-size BYTES   a file over this: WARN
#   max-size BYTES    a file over this: FAIL
#   subject CHARS     a subject line longer than this: WARN
# The patterns are matched against every line of every text file and message that would be sent, every path, and the
# author, committer and tagger of every commit and tag. A binary file (a NUL in its first 8000 bytes, as git decides)
# gets the size rules and its path only, and a file over max-size is refused without its text being read. Fixed
# rules, not set here: every commit and tag names a person with an email; a message is a subject, then a blank line
# before any body; nothing that a .gitignore (committed, .git/info/exclude or core.excludesFile) ignores; LF line
# endings in text files. Warnings, also fixed: a Git LFS pointer (its content is not pushed with it) and a submodule
# entry (its commits are not either).

# GitHub's own limits: a warning over 50 MiB, a refusal over 100 MiB
warn-size 52428800
max-size 104857600
subject 72

branch ^main$
tag ^v[0-9]+\.[0-9]+\.[0-9]+$

# keys and tokens by their published shapes, and passwords written into code or urls
secret -----BEGIN ([A-Z0-9]+ )*PRIVATE KEY( BLOCK)?-----
secret \bAKIA[0-9A-Z]{16}\b
secret \b(ghp|gho|ghu|ghs|ghr)_[A-Za-z0-9]{36,}\b
secret \bgithub_pat_[A-Za-z0-9_]{22,}
secret \bglpat-[A-Za-z0-9_-]{20,}
secret \bxox[abprs]-[A-Za-z0-9-]{10,}
secret \bsk-(ant-|proj-)?[A-Za-z0-9_-]{20,}
secret \bAIza[0-9A-Za-z_-]{35}\b
secret (?i)(password|passwd|pwd|secret|token|api[_-]?key|access[_-]?key|private[_-]?key)["']?[[:blank:]]*[:=][[:blank:]]*["'][^"'[:space:]]{6,}["']
secret (?i)[a-z][a-z0-9+.-]*://[^/[:space:]:@]+:[^/[:space:]@]{3,}@

# any email address, except the placeholders and GitHub's private addresses
private (?i)\b[a-z0-9._%+-]+@[a-z0-9.-]+\.[a-z]{2,}\b
allow (?i)@(users\.)?noreply\.github\.com\b
allow (?i)@example\.(com|org|net)\b

# Your own private text: the names, paths and addresses that must stay on your machines. Examples to adapt in your
# own file (a rule's value runs to the end of its line, so keep notes on lines of their own):
#
# a path in someone's home directory, and one written with a tilde
#   private /(home|Users)/[^/]+/
#   private (^|[[:space:]"'(=])[~]/
# addresses on your own network
#   private \b10\.[0-9]+\.[0-9]+\.[0-9]+\b
# your machines' names as words in text, not inside a longer token: hostA with no letter, digit, _ . / or - just
# before it, and no letter, digit, _ / or - just after it (a . after it only at a sentence's end), so a path
# component, a file name or a numbered series (h01 ... h99, when a machine is h26) is no hit; the second line takes
# two names joined by a slash
#   private (^|[^[:alnum:]_./-])(hostA|hostB)($|[^[:alnum:]_/-]|[.]($|[^[:alnum:]_]))
#   private \b(hostA|hostB)/(hostA|hostB)\b
# names not yet public, anywhere
#   private (?i)\bproject-codename\b
# one known, harmless hit, by where it is and what matched
#   allow ^docs/setup\.md:[0-9]+: hostA$
